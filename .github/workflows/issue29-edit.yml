name: Bounded Issue 29 authoring
on:
  push:
    branches: [fix/29-audit-hardening]
permissions:
  contents: read
jobs:
  author:
    if: github.event.head_commit.message == 'chore: execute audited runtime corrections (#29)'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Install locked dependencies and add regressions
        run: |
          corepack enable
          corepack pnpm@12.10.1 install --frozen-lockfile
          pnpm --filter @scriptorium/contracts build
          pnpm --filter @scriptorium/module-runtime build
          pnpm --filter @scriptorium/core build
          python3 .github/issue29-edit.py tests
      - name: Prove original runtime defects
        shell: bash
        run: |
          set +e
          node --import tsx --test --test-name-pattern='audit ' packages/api/src/server.test.ts modules/mcp/src/http.test.ts app/src/api-boundary.test.ts > /tmp/issue29-red.log 2>&1
          result=$?
          set -e
          cat /tmp/issue29-red.log
          test "$result" -ne 0
          grep -q 'AssertionError' /tmp/issue29-red.log
          ! grep -q 'ERR_MODULE_NOT_FOUND' /tmp/issue29-red.log
      - name: Apply bounded corrections and verify
        run: |
          python3 .github/issue29-edit.py apply
          pnpm typecheck
          node --import tsx --test packages/api/src/authorization-error.test.ts packages/api/src/server.test.ts modules/mcp/src/http.test.ts modules/mcp/src/session-lifetime.test.ts app/src/api.test.ts app/src/api-boundary.test.ts
          git diff --check
      - name: Commit only approved files to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/29-audit-hardening
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/server.ts packages/api/src/server.test.ts app/src/api.ts app/src/api.test.ts modules/mcp/src/http.ts modules/mcp/src/http.test.ts modules/mcp/src/index.ts packages/core/src/index.test.ts packages/core/src/transactions.test.ts Dockerfile AGENTS.md CONTRIBUTING.md
          git commit -m 'fix: enforce audited API and MCP boundaries (#29)'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/fix/29-audit-hardening
