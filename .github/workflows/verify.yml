name: Verify Scriptorium

on:
  pull_request:
  push:
    branches: [main, fix/29-audit-hardening]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: scriptorium-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Verify exact source
        run: |
          corepack enable
          corepack pnpm@12.10.1 install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm audit:core
          SCRIPTORIUM_PROFILE=full pnpm build
