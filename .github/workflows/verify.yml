name: Verify Scriptorium
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      unit: ${{ steps.select.outputs.unit }}
      types: ${{ steps.select.outputs.types }}
      build: ${{ steps.select.outputs.build }}
      oci: ${{ steps.select.outputs.oci }}
      browser: ${{ steps.select.outputs.browser }}
      hosted: ${{ steps.select.outputs.hosted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Select affected validations
        id: select
        env:
          SCRIPTORIUM_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci-impact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan/ci-plan.json
          if-no-files-found: error
          retention-days: 7
  unit:
    name: unit-${{ matrix.group }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.unit != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.unit) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.10.1 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.10.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          SCRIPTORIUM_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/unit-${{ matrix.group }}
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci-group.mjs "unit-${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-unit-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-evidence/unit-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
  types:
    name: types-${{ matrix.group }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.types != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.types) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.10.1 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.10.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          SCRIPTORIUM_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/types-${{ matrix.group }}
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci-group.mjs "types-${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-types-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-evidence/types-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
  build:
    name: build-${{ matrix.profile }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.build != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.10.1 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.10.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          SCRIPTORIUM_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/build-${{ matrix.profile }}
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci-group.mjs "build-${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-build-${{ matrix.profile }}
          path: ${{ runner.temp }}/ci-evidence/build-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
  oci:
    name: oci-${{ matrix.profile }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.oci != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.oci) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          SCRIPTORIUM_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/oci-${{ matrix.profile }}
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci-group.mjs "oci-${{ matrix.profile }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-oci-${{ matrix.profile }}
          path: ${{ runner.temp }}/ci-evidence/oci-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 7
  browser:
    name: browser-${{ matrix.group }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.browser != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.browser) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.10.1 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.10.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          SCRIPTORIUM_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/browser-${{ matrix.group }}
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci-group.mjs "browser-${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-failure-${{ matrix.group }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tests/e2e/test-results/**/trace.zip
            tests/e2e/test-results/**/error-context.md
            tests/e2e/test-results/**/journal-draft-*-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-browser-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-evidence/browser-${{ matrix.group }}
          if-no-files-found: error
          retention-days: 7
    container:
      image: mcr.microsoft.com/playwright@sha256:d65108d1a8095d8b0c4a5e32bf1807a40a5ce90ff0c78473e1116b1c243235e8
      options: --ipc=host
    env:
      SCRIPTORIUM_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SCRIPTORIUM_PLAYWRIGHT_IMAGE_DIGEST: sha256:d65108d1a8095d8b0c4a5e32bf1807a40a5ce90ff0c78473e1116b1c243235e8
  hosted:
    name: hosted-native-${{ matrix.selection }}
    needs:
      - plan
    if: needs.plan.result == 'success' && needs.plan.outputs.hosted != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        selection: ${{ fromJSON(needs.plan.outputs.hosted) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: docker/setup-buildx-action@v3
      - name: Prepare exact pnpm toolchain
        id: pnpm
        run: |
          corepack enable
          corepack pnpm@12.10.1 --version
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore content-addressed dependency cache
        id: dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-node24-pnpm12.10.1-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency cache hit=${{ steps.dependencies.outputs.cache-hit || 'false' }}
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: echo "Dependency cache hit=${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - name: Run selected validations
        env:
          SCRIPTORIUM_CI_REPORT_DIR: ${{ runner.temp }}/ci-evidence/hosted-native-${{ matrix.selection }}
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/ci-group.mjs "hosted-native-${{ matrix.selection }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-evidence-hosted-native-${{ matrix.selection }}
          path: ${{ runner.temp }}/ci-evidence/hosted-native-${{ matrix.selection }}
          if-no-files-found: error
          retention-days: 7
  certification:
    name: certification
    if: always()
    needs:
      - plan
      - unit
      - types
      - build
      - oci
      - browser
      - hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ci-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-*
          path: ${{ runner.temp }}/ci-evidence
      - name: Certify every required exact-source matrix element
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTORIUM_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCRIPTORIUM_REQUIRED_RESULTS: ${{ toJSON(needs) }}
          SCRIPTORIUM_CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
          SCRIPTORIUM_CI_PLAN_PATH: ${{ runner.temp }}/ci-plan/ci-plan.json
        run: node scripts/certify-ci.mjs
      - name: Record measured workflow timings
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/measure-ci.mjs --out "${{ runner.temp }}/ci-metrics.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-metrics
          path: ${{ runner.temp }}/ci-metrics.json
          retention-days: 14
