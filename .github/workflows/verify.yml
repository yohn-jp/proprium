name: Proprium Browser Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proprium-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs use the same trusted bytes, not a signing private key shared across
# runners. The handoff is verified with the published ephemeral public key
# after every download. A full re-run replaces the run-scoped artifact, while
# partial consumer re-runs reuse the successful producer artifact.
env:
  PROPRIUM_CI_ARTIFACT_ROOT: /tmp/proprium-authoring-ci-${{ github.run_id }}-${{ github.run_attempt }}
  PROPRIUM_SIGNED_AUTHORING_RELEASE_DIR: /tmp/proprium-authoring-ci-${{ github.run_id }}-${{ github.run_attempt }}/registry
  PROPRIUM_AUTHORING_TEST_ARTIFACT_BASE: http://127.0.0.1:4173/plugin-fixture/

jobs:
  prepare:
    name: Signed component build and unit verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROPRIUM_E2E_PLUGIN_REGISTRY_KEY_FILE: /tmp/proprium-authoring-private-${{ github.run_id }}-${{ github.run_attempt }}.pem
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.0
          target: wasm32-unknown-unknown
      - name: Install Research pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      # Cache built CLI executables, not the entire Cargo registry/target tree.
      # The tool versions and pinned Rust compiler determine the cache key.
      - name: Restore pinned Rust component CLI tools
        id: rust_cli_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-component
            ~/.cargo/bin/wasm-tools
          key: rust-component-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-component-0.21.1-wasm-tools-1.262.0
      - name: Install pinned cargo-component
        if: steps.rust_cli_cache.outputs.cache-hit != 'true'
        run: cargo install cargo-component --version 0.21.1 --locked
      - name: Install pinned wasm-tools composer
        if: steps.rust_cli_cache.outputs.cache-hit != 'true'
        run: cargo install wasm-tools --version 1.262.0 --locked
      - name: Verify pinned component tool versions
        run: |
          cargo component --version | grep -F '0.21.1'
          wasm-tools --version | grep -F '1.262.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify signed v1 and authoring registry fixtures
        run: pnpm test:plugin-registry
      - name: Verify authoring canon, freeze boundaries and complete feature inventory
        run: |
          node scripts/verify-authoring-canon.mjs
          node scripts/build-authoring-evidence.mjs --check
          node --test scripts/build-authoring-evidence.test.mjs scripts/authoring-feature-audit.test.mjs scripts/authoring-evidence-metadata.test.mjs
          node scripts/authoring-feature-audit.mjs --check
      - name: Build and verify all signed authoring components
        env:
          PROPRIUM_AUTHORING_BUILD_EVIDENCE_PATH: ${{ runner.temp }}/authoring-plugin-build-evidence.json
        run: pnpm test:authoring-plugin-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proprium-authoring-build-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authoring-plugin-build-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      # The TypeScript contracts are a shared output: build once rather than
      # letting three parallel test commands rebuild the same directory.
      - name: Build shared TypeScript contracts once
        run: pnpm --filter @scriptorium/contracts build
      # All five checks consume the completed component build and contract
      # output but no longer write each other's build artifacts.
      - parallel:
          - name: Verify Unicode normalization in an actual WASM component
            env:
              PROPRIUM_UNICODE_NORMALIZATION_TEST: ${{ runner.temp }}/NormalizationTest.txt
            run: |
              curl --fail --location --silent --show-error https://www.unicode.org/Public/17.0.0/ucd/NormalizationTest.txt -o "$PROPRIUM_UNICODE_NORMALIZATION_TEST"
              node --test plugins/shared/unicode.component.test.mjs
          - name: Typecheck the Browser Host and adapters
            run: pnpm --filter @proprium/host typecheck:proprium
          - name: Test browser Git and plugin security units
            run: pnpm --filter @proprium/host test:proprium
          - name: Test official authoring plugin domains
            run: node scripts/test-authoring-plugin-units.mjs
          - name: Test recovered editor, appearance and workspace layouts
            run: pnpm --dir app exec node --import tsx --test 'src/workspace/*.test.ts' 'src/editor/cm/*.test.ts' 'src/theme.test.ts' 'src/editor.test.ts' 'src/editor/terms.test.ts' 'src/journal.test.ts' 'src/continueCandidates.test.ts'
      - name: Derive and verify public test trust root
        run: |
          set -euo pipefail
          node -e 'const {readFileSync,writeFileSync}=require("node:fs"); const {createPrivateKey,createPublicKey}=require("node:crypto"); const privateKey=createPrivateKey(readFileSync(process.env.PROPRIUM_E2E_PLUGIN_REGISTRY_KEY_FILE)); const publicKey=createPublicKey(privateKey).export({format:"der",type:"spki"}).subarray(-32).toString("base64"); writeFileSync(process.env.PROPRIUM_CI_ARTIFACT_ROOT+"/public-key.txt",publicKey+"\n");'
          test -s "$PROPRIUM_CI_ARTIFACT_ROOT/public-key.txt"
          PROPRIUM_PLUGIN_OUTPUT_DIR="$PROPRIUM_SIGNED_AUTHORING_RELEASE_DIR" \
            PROPRIUM_PLUGIN_REGISTRY_PUBLIC_KEY="$(cat "$PROPRIUM_CI_ARTIFACT_ROOT/public-key.txt")" \
            node scripts/verify-plugin-registry.mjs authoring
      - name: Publish verified signed artifacts and public key
        uses: actions/upload-artifact@v4
        with:
          name: proprium-signed-authoring-ci-${{ github.run_id }}
          # Re-run all: replace the old successful producer's artifact.
          # Re-run only a failed consumer: reuse the successful producer's
          # artifact from the same run, verifying signatures before use.
          overwrite: true
          path: ${{ env.PROPRIUM_CI_ARTIFACT_ROOT }}/
          if-no-files-found: error
          retention-days: 2
  host:
    name: Browser Host, static shell and Git acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache-dependency-path: gateway/go.mod
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the static Proprium Host
        run: pnpm build:browser
      - name: Validate Workers Static Assets packaging without deployment
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc
      - name: Install desktop and mobile browser engines
        id: browser_engines
        run: pnpm exec playwright install --with-deps chromium webkit
      # Core acceptance runs on its own: it operates a Vite Host and a live
      # Gateway and is the highest-contention browser suite. Never share its
      # runner with other browser processes.
      - name: Exercise browser acceptance scenarios
        env:
          PROPRIUM_E2E_GITHUB_TOKEN: ${{ secrets.PROPRIUM_E2E_GITHUB_TOKEN }}
          PROPRIUM_E2E_GITHUB_OWNER: ${{ vars.PROPRIUM_E2E_GITHUB_OWNER }}
          PROPRIUM_E2E_GITHUB_REPOSITORY: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY }}
          PROPRIUM_E2E_GITHUB_REPOSITORY_ID: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY_ID }}
          PROPRIUM_E2E_GITHUB_BRANCH: ${{ vars.PROPRIUM_E2E_GITHUB_BRANCH }}
        run: pnpm test:browser:e2e
      - name: Exercise the production static shell offline
        if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
        env:
          PROPRIUM_E2E_GITHUB_TOKEN: ${{ secrets.PROPRIUM_E2E_GITHUB_TOKEN }}
          PROPRIUM_E2E_GITHUB_OWNER: ${{ vars.PROPRIUM_E2E_GITHUB_OWNER }}
          PROPRIUM_E2E_GITHUB_REPOSITORY: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY }}
          PROPRIUM_E2E_GITHUB_REPOSITORY_ID: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY_ID }}
          PROPRIUM_E2E_GITHUB_BRANCH: ${{ vars.PROPRIUM_E2E_GITHUB_BRANCH }}
        run: pnpm test:browser:static:e2e
      - name: Exercise existing Browser Git and Component Worker adapter scenarios
        if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
        env:
          SCRIPTORIUM_GITHUB_LIVE_TEST_TOKEN: ${{ secrets.PROPRIUM_E2E_GITHUB_TOKEN }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_OWNER: ${{ vars.PROPRIUM_E2E_GITHUB_OWNER }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_REPOSITORY: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_REPOSITORY_ID: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY_ID }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_BRANCH: ${{ vars.PROPRIUM_E2E_GITHUB_BRANCH }}
        run: pnpm test:browser:adapters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proprium-browser-evidence-host-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/browser/test-results/**
            tests/browser/playwright-report/**
            tests/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 14
  authoring:
    name: Official signed authoring acceptance
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore verified signed authoring registry
        uses: actions/download-artifact@v4
        with:
          name: proprium-signed-authoring-ci-${{ github.run_id }}
          path: ${{ env.PROPRIUM_CI_ARTIFACT_ROOT }}
      - name: Verify transferred signatures with the published test root
        run: |
          set -euo pipefail
          test -f "$PROPRIUM_CI_ARTIFACT_ROOT/public-key.txt"
          test -f "$PROPRIUM_SIGNED_AUTHORING_RELEASE_DIR/registry.json"
          public_key="$(cat "$PROPRIUM_CI_ARTIFACT_ROOT/public-key.txt")"
          PROPRIUM_PLUGIN_OUTPUT_DIR="$PROPRIUM_SIGNED_AUTHORING_RELEASE_DIR" \
            PROPRIUM_PLUGIN_REGISTRY_PUBLIC_KEY="$public_key" \
            node scripts/verify-plugin-registry.mjs authoring
          printf 'PROPRIUM_PLUGIN_REGISTRY_PUBLIC_KEY=%s\nPROPRIUM_SIGNED_AUTHORING_REGISTRY_PUBLIC_KEY=%s\n' "$public_key" "$public_key" >> "$GITHUB_ENV"
      - name: Build shared TypeScript contracts
        run: pnpm --filter @scriptorium/contracts build
      - name: Install desktop and mobile browser engines
        id: browser_engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise signed v2 transport with its fixture setup
        if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
        run: pnpm exec playwright test --config tests/browser/plugin-runtime-v2.playwright.config.ts
      - name: Exercise actual signed official plugins through the Host
        if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
        run: pnpm exec playwright test --config tests/browser/authoring-official.playwright.config.ts
      - name: Exercise all eight signed installs and persisted activation
        if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
        run: node scripts/authoring-evidence-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proprium-browser-evidence-authoring-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/browser/test-results/**
            tests/browser/playwright-report/**
            tests/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 14
  lifecycle:
    name: Signed lifecycle, tools and Gateway acceptance
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache-dependency-path: gateway/go.mod
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore verified signed authoring registry
        uses: actions/download-artifact@v4
        with:
          name: proprium-signed-authoring-ci-${{ github.run_id }}
          path: ${{ env.PROPRIUM_CI_ARTIFACT_ROOT }}
      - name: Verify transferred signatures with the published test root
        run: |
          set -euo pipefail
          test -f "$PROPRIUM_CI_ARTIFACT_ROOT/public-key.txt"
          test -f "$PROPRIUM_SIGNED_AUTHORING_RELEASE_DIR/registry.json"
          public_key="$(cat "$PROPRIUM_CI_ARTIFACT_ROOT/public-key.txt")"
          PROPRIUM_PLUGIN_OUTPUT_DIR="$PROPRIUM_SIGNED_AUTHORING_RELEASE_DIR" \
            PROPRIUM_PLUGIN_REGISTRY_PUBLIC_KEY="$public_key" \
            node scripts/verify-plugin-registry.mjs authoring
          printf 'PROPRIUM_PLUGIN_REGISTRY_PUBLIC_KEY=%s\nPROPRIUM_SIGNED_AUTHORING_REGISTRY_PUBLIC_KEY=%s\n' "$public_key" "$public_key" >> "$GITHUB_ENV"
      - name: Build shared TypeScript contracts
        run: pnpm --filter @scriptorium/contracts build
      - name: Install desktop and mobile browser engines
        id: browser_engines
        run: pnpm exec playwright install --with-deps chromium webkit
      # Explicit environment ports are required: the imported shared
      # Playwright base config populates PROPRIUM_E2E_PORT=4173 before the
      # specialized config chooses its own fallback port. Never rely on
      # fallback defaults when parallelizing suites.
      # The retained signed component manifests pin their artifact URL to
      # 127.0.0.1:4173. The browser acceptance fixtures explicitly intercept
      # only the expected pinned artifact origin plus the isolated registry
      # origin, so port isolation does not rewrite or weaken signatures.
      # Both use separate browser ports and output directories. Limit
      # concurrency to two resource-intensive Playwright invocations.
      - parallel:
          - name: Exercise Knowledge and Research authoring surfaces
            if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
            env:
              PROPRIUM_E2E_PORT: "4237"
            run: pnpm exec playwright test --config tests/browser/authoring-knowledge.playwright.config.ts
          - name: Preserve source BOM through Core editing and export
            if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
            env:
              PROPRIUM_E2E_PORT: "4282"
            run: pnpm exec playwright test --config tests/browser/authoring-bom-core.playwright.config.ts
      # These are separate Playwright processes. Set unique host ports:
      # their default 4173 would otherwise collide; each fixture setup
      # uses a unique temp directory and its own test-result directory.
      - parallel:
          - name: Exercise Narrative next scene and portable positions
            if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
            env:
              PROPRIUM_E2E_PORT: "4311"
            run: pnpm exec playwright test --config tests/browser/authoring-navigation.playwright.config.ts
          - name: Exercise repeated reading mark approval and source navigation
            if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
            env:
              PROPRIUM_E2E_PORT: "4312"
            run: pnpm exec playwright test --config tests/browser/authoring-readingmarks.playwright.config.ts
          - name: Persist local Semantic preferences without model admission
            if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
            env:
              PROPRIUM_E2E_PORT: "4313"
            run: pnpm exec playwright test --config tests/browser/semantic-preferences.playwright.config.ts
      - name: Exercise signed update and rollback with retained actual components
        if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
        env:
          PROPRIUM_VERSION_FIXTURE_DIR: ${{ runner.temp }}/authoring-version-fixture
        run: |
          node scripts/test-authoring-version-fixture.mjs "$PROPRIUM_SIGNED_AUTHORING_RELEASE_DIR" "$PROPRIUM_VERSION_FIXTURE_DIR"
          PROPRIUM_AUTHORING_REGISTRY_DIR="$PROPRIUM_VERSION_FIXTURE_DIR" PROPRIUM_AUTHORING_REGISTRY_PUBLIC_KEY_FILE="$PROPRIUM_VERSION_FIXTURE_DIR/test-root-public-key.txt" node scripts/authoring-evidence-e2e.mjs
      # Both suites use independent signed fixtures and different Vite ports.
      - parallel:
          - name: Exercise signed Publishing downloads and print
            if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
            env:
              PROPRIUM_E2E_PORT: "4314"
            run: pnpm exec playwright test --config tests/browser/authoring-publishing.playwright.config.ts
          - name: Exercise signed Diagnostics, Paired Writing and Speaker workflows
            if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
            env:
              PROPRIUM_E2E_PORT: "4315"
            run: pnpm exec playwright test --config tests/browser/authoring-tools.playwright.config.ts
      - name: Exercise official typed actions through the live Gateway
        if: ${{ !cancelled() && steps.browser_engines.outcome == 'success' }}
        run: pnpm exec playwright test --config tests/browser/authoring-mcp.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proprium-browser-evidence-lifecycle-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tests/browser/test-results/**
            tests/browser/playwright-report/**
            tests/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 14
  verify:
    # Keep the original required check name even though it is now an aggregate.
    name: Browser host, Git, plugins and static assets
    if: ${{ always() }}
    needs: [prepare, host, authoring, lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all four verification lanes to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          HOST_RESULT: ${{ needs.host.result }}
          AUTHORING_RESULT: ${{ needs.authoring.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
        run: |
          set -euo pipefail
          failed=0
          for lane in PREPARE HOST AUTHORING LIFECYCLE; do
            variable="${lane}_RESULT"
            result="${!variable}"
            echo "$lane: $result"
            if [ "$result" != success ]; then failed=1; fi
          done
          exit "$failed"
