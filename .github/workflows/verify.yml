name: Proprium Browser Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proprium-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Browser host, Git, plugins and static assets
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache-dependency-path: gateway/go.mod
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the Browser Host and adapters
        run: pnpm typecheck:browser
      - name: Test browser Git and plugin security units
        run: pnpm test:browser:unit
      - name: Build the static Proprium Host
        run: pnpm build:browser
      - name: Validate Workers Static Assets packaging without deployment
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc
      - name: Install desktop and mobile browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise browser acceptance scenarios
        env:
          PROPRIUM_E2E_GITHUB_TOKEN: ${{ secrets.PROPRIUM_E2E_GITHUB_TOKEN }}
          PROPRIUM_E2E_GITHUB_OWNER: ${{ vars.PROPRIUM_E2E_GITHUB_OWNER }}
          PROPRIUM_E2E_GITHUB_REPOSITORY: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY }}
          PROPRIUM_E2E_GITHUB_REPOSITORY_ID: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY_ID }}
          PROPRIUM_E2E_GITHUB_BRANCH: ${{ vars.PROPRIUM_E2E_GITHUB_BRANCH }}
        run: pnpm test:browser:e2e
      - name: Exercise the production static shell offline
        env:
          PROPRIUM_E2E_GITHUB_TOKEN: ${{ secrets.PROPRIUM_E2E_GITHUB_TOKEN }}
          PROPRIUM_E2E_GITHUB_OWNER: ${{ vars.PROPRIUM_E2E_GITHUB_OWNER }}
          PROPRIUM_E2E_GITHUB_REPOSITORY: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY }}
          PROPRIUM_E2E_GITHUB_REPOSITORY_ID: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY_ID }}
          PROPRIUM_E2E_GITHUB_BRANCH: ${{ vars.PROPRIUM_E2E_GITHUB_BRANCH }}
        run: pnpm test:browser:static:e2e
      - name: Exercise existing Browser Git and Component Worker adapter scenarios
        env:
          SCRIPTORIUM_GITHUB_LIVE_TEST_TOKEN: ${{ secrets.PROPRIUM_E2E_GITHUB_TOKEN }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_OWNER: ${{ vars.PROPRIUM_E2E_GITHUB_OWNER }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_REPOSITORY: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_REPOSITORY_ID: ${{ vars.PROPRIUM_E2E_GITHUB_REPOSITORY_ID }}
          SCRIPTORIUM_GITHUB_LIVE_TEST_BRANCH: ${{ vars.PROPRIUM_E2E_GITHUB_BRANCH }}
        run: pnpm test:browser:adapters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proprium-browser-evidence-${{ github.sha }}
          path: |
            tests/browser/test-results/**
            tests/browser/playwright-report/**
            tests/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 14
