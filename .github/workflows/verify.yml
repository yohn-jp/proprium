name: Verify Scriptorium
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: scriptorium-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COREPACK_HOME: /tmp/scriptorium-corepack
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Install exact source dependencies
        run: |
          corepack enable
          corepack pnpm@12.10.1 install --frozen-lockfile
      - name: Prepare bounded offline diagnostic checkout
        if: github.head_ref == 'fix/29-audit-hardening'
        run: |
          tar -czf "$RUNNER_TEMP/scriptorium-checkout.tar.gz" .
          tar -czf "$RUNNER_TEMP/scriptorium-toolchain.tar.gz" -C "$(dirname "$(dirname "$(command -v node)")")" bin lib
          tar -czf "$RUNNER_TEMP/scriptorium-corepack.tar.gz" -C "$COREPACK_HOME" .
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'fix/29-audit-hardening'
        with:
          name: issue29-offline-diagnostics
          path: |
            ${{ runner.temp }}/scriptorium-checkout.tar.gz
            ${{ runner.temp }}/scriptorium-toolchain.tar.gz
            ${{ runner.temp }}/scriptorium-corepack.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Verify exact source and test types
        run: |
          pnpm typecheck
          pnpm typecheck:tests
          pnpm typecheck:safety
          pnpm test
          node --test scripts/release-policy.test.mjs
          pnpm build
          pnpm audit:core
          SCRIPTORIUM_PROFILE=full pnpm build
  hosted:
    name: hosted-native
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: docker/setup-buildx-action@v3
      - name: Build all native Producer inputs
        run: |
          corepack enable
          corepack pnpm@12.10.1 install --frozen-lockfile
          pnpm build:workspace
      - name: Verify exact native catalog and composition with disposable OCI inputs
        run: node scripts/verify-hosted-native.mjs
  oci:
    name: oci-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Verify existing production OCI startup, HTTP, UID and shutdown path
        env:
          OCI_ENGINE: docker
          SCRIPTORIUM_PROFILE: ${{ matrix.profile }}
          SCRIPTORIUM_OCI_IMAGE: scriptorium-verification:${{ matrix.profile }}
        run: bash scripts/verify-oci.sh
  browser:
    name: browser-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Build and test production browser surfaces with disposable local repositories
        env:
          SCRIPTORIUM_PROFILE: ${{ matrix.profile }}
        run: |
          corepack enable
          corepack pnpm@12.10.1 install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium webkit
          pnpm exec playwright test --config tests/e2e/playwright.config.ts
