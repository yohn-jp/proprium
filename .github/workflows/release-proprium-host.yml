name: Release Proprium Host

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/**'
      - 'plugins/narrative/**'
      - 'plugins/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'wrangler.jsonc'
      - 'scripts/verify-proprium-static.mjs'
      - 'scripts/build-proprium-static.mjs'
      - '.github/workflows/release-proprium-host.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proprium-host-production
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish static Host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: proprium-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an exact main commit
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Host releases must be dispatched from main." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Host configuration
        env:
          VITE_PROPRIUM_GATEWAY_URL: ${{ vars.VITE_PROPRIUM_GATEWAY_URL }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_URL: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_URL }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_KEY: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_KEY }}
          VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS: ${{ vars.VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS }}
        run: |
          test -n "$VITE_PROPRIUM_PLUGIN_REGISTRY_URL"
          test -n "$VITE_PROPRIUM_PLUGIN_REGISTRY_KEY"
          test -n "$VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS"
      - name: Run Browser Host checks and static packaging rehearsal
        env:
          VITE_PROPRIUM_GATEWAY_URL: ${{ vars.VITE_PROPRIUM_GATEWAY_URL }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_URL: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_URL }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_KEY: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_KEY }}
          VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS: ${{ vars.VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS }}
        run: pnpm verify:browser
      - name: Deploy Workers Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler deploy --config wrangler.jsonc --env production --name proprium-host-production
