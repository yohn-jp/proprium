name: Release Proprium Host

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Cloudflare Workers environment configured in GitHub
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: proprium-host-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish static Host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: proprium-${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an exact main commit
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Host releases must be dispatched from main." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release configuration
        env:
          PROPRIUM_HOST_ORIGIN: ${{ vars.PROPRIUM_HOST_ORIGIN }}
          PROPRIUM_GITHUB_OAUTH_CLIENT_ID: ${{ vars.PROPRIUM_GITHUB_OAUTH_CLIENT_ID }}
          VITE_PROPRIUM_GITHUB_AUTH_RELAY: ${{ vars.VITE_PROPRIUM_GITHUB_AUTH_RELAY }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_URL: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_URL }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_KEY: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_KEY }}
          VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS: ${{ vars.VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS }}
        run: |
          test -n "$PROPRIUM_HOST_ORIGIN"
          test -n "$PROPRIUM_GITHUB_OAUTH_CLIENT_ID"
          test -n "$VITE_PROPRIUM_GITHUB_AUTH_RELAY"
          test -n "$VITE_PROPRIUM_PLUGIN_REGISTRY_URL"
          test -n "$VITE_PROPRIUM_PLUGIN_REGISTRY_KEY"
          test -n "$VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS"
      - name: Run Browser Host checks and static packaging rehearsal
        env:
          VITE_PROPRIUM_GITHUB_AUTH_RELAY: ${{ vars.VITE_PROPRIUM_GITHUB_AUTH_RELAY }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_URL: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_URL }}
          VITE_PROPRIUM_PLUGIN_REGISTRY_KEY: ${{ vars.VITE_PROPRIUM_PLUGIN_REGISTRY_KEY }}
          VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS: ${{ vars.VITE_PROPRIUM_PLUGIN_ARTIFACT_ORIGINS }}
        run: pnpm verify:browser
      - name: Deploy the minimal GitHub OAuth and Smart HTTP relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROPRIUM_HOST_ORIGIN: ${{ vars.PROPRIUM_HOST_ORIGIN }}
          PROPRIUM_GITHUB_OAUTH_CLIENT_ID: ${{ vars.PROPRIUM_GITHUB_OAUTH_CLIENT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler deploy --config workers/github-auth/wrangler.jsonc \
            --name "proprium-github-auth-relay-${TARGET_ENVIRONMENT}" \
            --var "HOST_ORIGIN:${PROPRIUM_HOST_ORIGIN}" \
            --var "GITHUB_CLIENT_ID:${PROPRIUM_GITHUB_OAUTH_CLIENT_ID}"
      - name: Deploy Workers Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler deploy --config wrangler.jsonc --name "proprium-host-${TARGET_ENVIRONMENT}"
