name: Release Proprium Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'gateway/**'
      - '.github/workflows/release-proprium-gateway.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing proprium-gateway-vX.Y.Z tag reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proprium-gateway-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify main source and build binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache-dependency-path: gateway/go.mod
      - name: Verify tag identifies a commit on main
        id: source
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('proprium-gateway-v0.0.{0}', github.run_number) }}
        run: |
          set -eu
          case "$INPUT_TAG" in
            proprium-gateway-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected proprium-gateway-vX.Y.Z." >&2; exit 1 ;;
          esac
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^proprium-gateway-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Tag must use canonical semantic version syntax." >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin "+refs/tags/${INPUT_TAG}:refs/tags/${INPUT_TAG}"
            tag_commit="$(git rev-parse "refs/tags/${INPUT_TAG}^{commit}")"
          else
            tag_commit="$(git rev-parse HEAD)"
            if git ls-remote --exit-code --tags origin "refs/tags/${INPUT_TAG}" >/dev/null; then
              echo 'Automatic release tag already exists.' >&2; exit 1
            fi
          fi
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main
          version="${INPUT_TAG#proprium-gateway-v}"
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$INPUT_TAG" "$version" "$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet Gateway
        run: go vet ./...
      - name: Build Gateway binaries for supported platforms
        env:
          VERSION: ${{ steps.source.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          mkdir -p ../gateway-binaries ../release-assets
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            extension=""
            if [ "$GOOS" = windows ]; then extension=".exe"; fi
            name="proprium-gateway_${VERSION}_${GOOS}_${GOARCH}${extension}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
              -o "../gateway-binaries/${name}" .
            strings "../gateway-binaries/${name}" | grep -F "$VERSION" >/dev/null
            strings "../gateway-binaries/${name}" | grep -F "$COMMIT" >/dev/null
          done
          VERSION="$VERSION" COMMIT="$COMMIT" \
            GATEWAY_BINARIES="$PWD/../gateway-binaries" \
            RELEASE_ASSETS="$PWD/../release-assets" \
            bash distribution/package-release.sh
          bash distribution/verify-release-assets.sh ../release-assets "$VERSION" "$COMMIT"
          test "$(find ../release-assets -maxdepth 1 -type f -name 'proprium-gateway_*.tar.gz' | wc -l)" -eq 5
          for archive in ../release-assets/proprium-gateway_*.tar.gz; do
            tar -tzf "$archive" | grep -Eq '(^|/)manifest$'
            if tar -tzf "$archive" | grep -Eq '^\./[^/]+/'; then
              echo "Bundle contains nested files: $archive" >&2; exit 1
            fi
          done
          (cd ../release-assets && sha256sum --check SHA256SUMS)
          grep -Fx "tag=${{ steps.source.outputs.tag }}" ../release-assets/SOURCE.txt
          grep -Fx "version=$VERSION" ../release-assets/SOURCE.txt
          grep -Fx "commit=$COMMIT" ../release-assets/SOURCE.txt
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: proprium-gateway-${{ steps.source.outputs.version }}-${{ steps.source.outputs.commit }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified binaries to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download binaries from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: proprium-gateway-${{ needs.build.outputs.version }}-${{ needs.build.outputs.commit }}
          path: release-assets
      - name: Verify source manifest and checksums before publishing
        id: source
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('proprium-gateway-v0.0.{0}', github.run_number) }}
        run: |
          set -eu
          case "$INPUT_TAG" in
            proprium-gateway-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected proprium-gateway-vX.Y.Z." >&2; exit 1 ;;
          esac
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin "+refs/tags/${INPUT_TAG}:refs/tags/${INPUT_TAG}"
            tag_commit="$(git rev-parse "refs/tags/${INPUT_TAG}^{commit}")"
          else
            tag_commit="$(git rev-parse HEAD)"
          fi
          git merge-base --is-ancestor "$tag_commit" origin/main
          test "$tag_commit" = "$(git rev-parse HEAD)"
          grep -Fx "tag=${INPUT_TAG}" release-assets/SOURCE.txt
          grep -Fx "version=${INPUT_TAG#proprium-gateway-v}" release-assets/SOURCE.txt
          grep -Fx "commit=${tag_commit}" release-assets/SOURCE.txt
          (cd release-assets && sha256sum --check SHA256SUMS)
          test "$(find release-assets -maxdepth 1 -type f -name 'proprium-gateway_*.tar.gz' | wc -l)" -eq 5
          test -s release-assets/proprium
          test -s release-assets/bootstrap.sh
          bash gateway/distribution/verify-release-assets.sh release-assets \
            "${INPUT_TAG#proprium-gateway-v}" "$tag_commit"
          if find release-assets -maxdepth 1 -type f -name 'proprium-gateway_*' ! -name '*.tar.gz' | grep -q .; then
            echo 'Unexpected unbundled Gateway binary in release assets.' >&2; exit 1
          fi
          printf 'tag=%s\nversion=%s\ncommit=%s\n' \
            "$INPUT_TAG" "${INPUT_TAG#proprium-gateway-v}" "$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          printf 'Proprium Gateway %s.\n\nSource commit: %s. Download the matching platform bundle, the standalone Linux proprium CLI, and bootstrap.sh as needed. Verify release assets against their GitHub API SHA-256 digests; SHA256SUMS also covers each bundle and the standalone CLI/bootstrap files.\n' \
            "${TAG#proprium-gateway-v}" "$COMMIT" > /tmp/proprium-release-notes.md
          gh release create "$TAG" release-assets/* \
            --target "$COMMIT" \
            --title "$TAG" \
            --notes-file /tmp/proprium-release-notes.md
      - name: Verify GitHub API asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -eu
          api="repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          gh api "$api" > /tmp/proprium-release.json
          for asset in release-assets/*; do
            name="${asset##*/}"
            expected="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // ""' /tmp/proprium-release.json)"
            if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
              echo "GitHub did not report the expected SHA-256 asset digest for $name (got '$actual')." >&2
              exit 1
            fi
          done
