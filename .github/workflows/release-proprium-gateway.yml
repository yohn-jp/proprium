name: Release Proprium Gateway

on:
  push:
    tags:
      - proprium-gateway-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing proprium-gateway-vX.Y.Z tag reachable from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proprium-gateway-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify tagged source and build binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache-dependency-path: gateway/go.mod
      - name: Verify tag identifies a commit on main
        id: source
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$INPUT_TAG" in
            proprium-gateway-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected proprium-gateway-vX.Y.Z." >&2; exit 1 ;;
          esac
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^proprium-gateway-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Tag must use canonical semantic version syntax." >&2
            exit 1
          fi
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/tags/${INPUT_TAG}:refs/tags/${INPUT_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${INPUT_TAG}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main
          version="${INPUT_TAG#proprium-gateway-v}"
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$INPUT_TAG" "$version" "$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet Gateway
        run: go vet ./...
      - name: Build single-file binaries for supported platforms
        env:
          TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          mkdir -p ../release-assets
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            extension=""
            if [ "$GOOS" = windows ]; then extension=".exe"; fi
            name="proprium-gateway_${VERSION}_${GOOS}_${GOARCH}${extension}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
              -o "../release-assets/${name}" .
            strings "../release-assets/${name}" | grep -Fq "$VERSION"
            strings "../release-assets/${name}" | grep -Fq "$COMMIT"
          done
          cd ../release-assets
          sha256sum proprium-gateway_* > SHA256SUMS
          printf 'tag=%s\nversion=%s\ncommit=%s\ngo=%s\n' \
            "$TAG" "$VERSION" "$COMMIT" "$(go version)" > SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proprium-gateway-${{ steps.source.outputs.version }}-${{ steps.source.outputs.commit }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified binaries to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download binaries from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: proprium-gateway-${{ needs.build.outputs.version }}-${{ needs.build.outputs.commit }}
          path: release-assets
      - name: Verify source manifest and checksums before publishing
        id: source
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$INPUT_TAG" in
            proprium-gateway-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected proprium-gateway-vX.Y.Z." >&2; exit 1 ;;
          esac
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/tags/${INPUT_TAG}:refs/tags/${INPUT_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${INPUT_TAG}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main
          test "$tag_commit" = "$(git rev-parse HEAD)"
          grep -Fx "tag=${INPUT_TAG}" release-assets/SOURCE.txt
          grep -Fx "version=${INPUT_TAG#proprium-gateway-v}" release-assets/SOURCE.txt
          grep -Fx "commit=${tag_commit}" release-assets/SOURCE.txt
          (cd release-assets && sha256sum --check SHA256SUMS)
          printf 'tag=%s\nversion=%s\ncommit=%s\n' \
            "$INPUT_TAG" "${INPUT_TAG#proprium-gateway-v}" "$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          printf 'Proprium Gateway %s.\n\nSource commit: %s. Verify downloaded files with SHA256SUMS. Each platform artifact is one self-contained executable; it requires neither a container nor a database.\n' \
            "${TAG#proprium-gateway-v}" "$COMMIT" > /tmp/proprium-release-notes.md
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/proprium-release-notes.md
