name: Proprium Gateway Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proprium-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, vet and build Gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache-dependency-path: gateway/go.mod
      - name: Check Gateway module
        run: test -f go.mod
      - name: Verify Go toolchain
        run: test "$(go version | awk '{print $3}')" = "go1.27.3"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet Gateway
        run: go vet ./...
      - name: Build release-compatible binaries for supported platforms
        env:
          COMMIT: ${{ github.sha }}
          VERSION: dev
        run: |
          set -eu
          mkdir -p ../gateway-artifacts
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            extension=""
            if [ "$GOOS" = windows ]; then extension=".exe"; fi
            name="proprium-gateway_${VERSION}_${GOOS}_${GOARCH}${extension}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
              -o "../gateway-artifacts/${name}" .
            strings "../gateway-artifacts/${name}" | grep -F "$VERSION" >/dev/null
            strings "../gateway-artifacts/${name}" | grep -F "$COMMIT" >/dev/null
          done
          cd ../gateway-artifacts
          sha256sum proprium-gateway_* > SHA256SUMS
          printf 'version=%s\ncommit=%s\ngo=%s\n' \
            "$VERSION" "$COMMIT" "$(go version)" > SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proprium-gateway-${{ github.sha }}
          path: gateway-artifacts/*
          if-no-files-found: error
          retention-days: 14
