name: Proprium Gateway Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proprium-gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, vet and build Gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache-dependency-path: gateway/go.mod
      - name: Check Gateway module
        run: test -f go.mod
      - name: Verify Go toolchain
        run: test "$(go version | awk '{print $3}')" = "go1.27.3"
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet Gateway
        run: go vet ./...
      - name: Build static Linux amd64 Gateway
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o /tmp/proprium-gateway .
