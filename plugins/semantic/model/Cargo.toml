[package]
name = "proprium-semantic-inference"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sha2 = "0.10.9"
unicode-segmentation = "=1.13.3"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
tract-onnx = "0.23.9"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[patch.crates-io]
ahash = { path = "vendor/ahash" }

[package.metadata.component]
package = "proprium:semantic-inference"
