<!doctype html>
<meta charset="utf-8">
<title>Core 64 journal probe</title>
<script type="module">
  import {
    BrowserJournal,
    documentKey,
    journalEntryKey,
    repositoryKey,
  } from "/src/storage/journal.ts";
  import { assertChangeOperation } from "@scriptorium/contracts";

  const databaseName = "scriptorium-recovery";
  const databaseVersion = 3;
  const encoder = new TextEncoder();
  const remoteCommit = "a".repeat(40);
  const documentRevision = "b".repeat(64);
  const checkpointRevision = "c".repeat(64);

  function repositoryFor(index = 0) {
    const owner = `core64-owner-${index}`;
    const name = `core64-repository-${index}`;
    return {
      provider: "github",
      repositoryId: `core64-id-${index}`,
      ownerScope: owner,
      defaultBranch: "main",
      url: `https://github.com/${owner}/${name}`,
    };
  }

  function operationFor(repository, path, id, generation, content) {
    return {
      id,
      generation,
      repository,
      baseRemoteCommit: remoteCommit,
      effect: "manuscript",
      reads: [{ path, revision: documentRevision }],
      writes: [{ path, revision: documentRevision, content }],
      message: `Write synthetic journal record ${id}`,
    };
  }

  function entryFor({ repository, authorScope, path, id, generation, text, baseText, state = "draft" }) {
    const operation = operationFor(repository, path, id, generation, text);
    assertChangeOperation(operation);
    const entry = {
      version: 1,
      key: "",
      repositoryKey: repositoryKey(repository),
      documentKey: documentKey(repository, path),
      authorScope,
      repository,
      documentPath: path,
      sceneId: "core64-synthetic-scene",
      snapshot: { repository, remoteCommit },
      text,
      baseText,
      operation,
      state,
      updatedAt: Date.now(),
    };
    entry.key = journalEntryKey(entry);
    if (state === "checkpointed") {
      entry.proposalId = `author-${id}-${generation}`;
      entry.authorizedAt = entry.updatedAt;
      entry.checkpoint = {
        operationId: id,
        generation,
        localCommit: generation.toString(16).padStart(40, "0"),
        remoteBase: remoteCommit,
        revisions: [{ path, revision: checkpointRevision }],
      };
    }
    return entry;
  }

  function proposalFor(entry, id) {
    return {
      key: JSON.stringify([entry.repositoryKey, entry.authorScope, id]),
      repositoryKey: entry.repositoryKey,
      authorScope: entry.authorScope,
      repository: entry.repository,
      proposal: {
        id,
        snapshot: entry.snapshot,
        operations: [entry.operation],
        source: "author",
      },
      createdAt: Date.now(),
    };
  }

  function fixedUtf8(bytes, symbol) {
    if (bytes % 4 !== 0) throw new Error(`The probe text size ${bytes} is not divisible by four.`);
    return symbol.repeat(bytes / 4);
  }

  function utf8Bytes(value) {
    return encoder.encode(value).byteLength;
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(databaseName, databaseVersion);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error ?? new Error("IndexedDB open failed"));
    });
  }

  function transactionDone(transaction) {
    return new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onabort = () => reject(transaction.error ?? new Error("IndexedDB transaction aborted"));
      transaction.onerror = () => reject(transaction.error ?? new Error("IndexedDB transaction failed"));
    });
  }

  async function replaceStores({ entries = [], proposals = [], includeProposals = false }) {
    const database = await openDatabase();
    try {
      const stores = includeProposals ? ["operations", "proposals"] : ["operations"];
      const transaction = database.transaction(stores, "readwrite");
      const done = transactionDone(transaction);
      const entryStore = transaction.objectStore("operations");
      entryStore.clear();
      for (const entry of entries) entryStore.put(entry);
      if (includeProposals) {
        const proposalStore = transaction.objectStore("proposals");
        proposalStore.clear();
        for (const proposal of proposals) proposalStore.put(proposal);
      }
      await done;
    } finally {
      database.close();
    }
  }

  function requireMetrics() {
    if (!window.__core64JournalMetrics) throw new Error("The journal metrics probe did not initialize.");
    return window.__core64JournalMetrics;
  }

  function lastTransaction(metrics, start) {
    const transaction = metrics.transactions.find((item) => item.start >= start && item.stores.includes("operations"));
    if (!transaction || transaction.status !== "complete") throw new Error("The measured operations transaction did not complete.");
    return transaction;
  }

  function lastGetAll(metrics, start, store) {
    const request = metrics.reads.find((item) => item.start >= start && item.store === store && item.method === "getAll");
    if (!request || request.status !== "complete") throw new Error(`The measured ${store}.getAll request did not complete.`);
    return request;
  }

  function firstTransaction(metrics, start, store) {
    const transaction = metrics.transactions.find((item) => item.start >= start && item.stores.includes(store));
    if (!transaction || transaction.status !== "complete") throw new Error(`The measured ${store} transaction did not complete.`);
    return transaction;
  }

  async function measurePayload({ bytes, repeats }) {
    const beforeOpen = await navigator.storage.estimate();
    const journal = await BrowserJournal.open();
    try {
      const emptyDatabase = await navigator.storage.estimate();
      const repository = repositoryFor(0);
      const path = `manuscript/core64-record-${bytes}.md`;
      const baseText = fixedUtf8(bytes, "😀");
      const text = fixedUtf8(bytes, "🙂");
      const entry = entryFor({ repository, authorScope: "owner", path, id: `c64-record-${bytes}`, generation: 1, text, baseText });
      const encodedBefore = await navigator.storage.estimate();
      await journal.put(entry);
      await new Promise((resolve) => setTimeout(resolve, 100));
      const encodedAfter = await navigator.storage.estimate();
      const restored = await journal.getDocument(repository, path, "owner");
      if (restored.length !== 1 || restored[0].text !== text || restored[0].baseText !== baseText ||
          restored[0].operation.writes[0]?.content !== text) {
        throw new Error(`The ${bytes}-byte record did not restore its exact text and base payload.`);
      }
      const record = restored[0];
      const writeContent = record.operation.writes[0].content;
      const logicalContent = [record.text, record.baseText, writeContent];
      const samples = [];
      const metrics = requireMetrics();
      for (let sample = 0; sample < repeats; sample++) {
        metrics.reset();
        const start = performance.now();
        const result = await journal.getDocument(repository, path, "owner");
        const elapsedMs = performance.now() - start;
        if (result.length !== 1 || result[0].text !== text || result[0].baseText !== baseText ||
            result[0].operation.writes[0]?.content !== text) {
          throw new Error(`The ${bytes}-byte record failed exact recovery at sample ${sample + 1}.`);
        }
        const request = lastGetAll(metrics, start, "operations");
        const transaction = firstTransaction(metrics, start, "operations");
        const measuredRequests = metrics.reads.filter((item) => item.start >= start && item.store === "operations" && item.method === "getAll");
        const measuredTransactions = metrics.transactions.filter((item) => item.start >= start && item.stores.includes("operations"));
        if (measuredRequests.length !== 1 || measuredTransactions.length !== 1) throw new Error("getDocument issued an unexpected number of IndexedDB reads or transactions.");
        samples.push({ elapsedMs, requestMs: request.ms, returnedRecords: request.records,
          readSource: request.source, readMethod: request.method, readStore: request.store, readIndex: request.index ?? null,
          requestCount: measuredRequests.length, transactionCount: measuredTransactions.length,
          transactionMode: transaction.mode, transactionDurability: transaction.durability,
          transactionMs: transaction.ms });
      }
      return {
        targetTextUtf8Bytes: bytes,
        text: { utf8Bytes: utf8Bytes(record.text), utf16CodeUnits: record.text.length, codePoints: Array.from(record.text).length },
        baseText: { utf8Bytes: utf8Bytes(record.baseText), utf16CodeUnits: record.baseText.length, codePoints: Array.from(record.baseText).length },
        operationWriteContent: { utf8Bytes: utf8Bytes(writeContent), utf16CodeUnits: writeContent.length, codePoints: Array.from(writeContent).length },
        duplicateContentLogical: {
          utf8Bytes: logicalContent.reduce((total, value) => total + utf8Bytes(value), 0),
          utf16CodeUnits: logicalContent.reduce((total, value) => total + value.length, 0),
          codePoints: logicalContent.reduce((total, value) => total + Array.from(value).length, 0),
        },
        jsonSerializationUtf8Bytes: utf8Bytes(JSON.stringify(record)),
        originStorageEstimate: {
          beforeDatabaseOpenBytes: beforeOpen.usage ?? null,
          afterEmptyDatabaseOpenBytes: emptyDatabase.usage ?? null,
          beforeRecordPutBytes: encodedBefore.usage ?? null,
          afterRecordPutBytes: encodedAfter.usage ?? null,
          recordPutDeltaEstimateBytes: encodedBefore.usage == null || encodedAfter.usage == null ? null : encodedAfter.usage - encodedBefore.usage,
          originQuotaBytes: encodedAfter.quota ?? null,
        },
        exactRestore: true,
        getDocumentSamples: samples,
      };
    } finally {
      journal.close();
    }
  }

  async function seedAndMeasurePutLatestDraft({ count, sample }) {
    const journal = await BrowserJournal.open();
    try {
      const repository = repositoryFor(1);
      const path = "manuscript/core64-indexed-draft.md";
      const protectedEntries = Array.from({ length: count }, (_, index) => {
        const generation = index + 1;
        const id = `c64-checkpoint-${sample}-${index}`;
        const entry = entryFor({ repository, authorScope: "owner", path, id, generation,
          text: `Checkpointed operation ${sample}/${index}\n`, baseText: "Remote manuscript\n", state: "checkpointed" });
        return entry;
      });
      await replaceStores({ entries: protectedEntries });
      const incoming = entryFor({ repository, authorScope: "owner", path,
        id: `c64-new-draft-${count}-${sample}`, generation: count + 1,
        text: `Current draft at occupancy ${count}, sample ${sample}.\n`, baseText: "Remote manuscript\n" });
      const metrics = requireMetrics();
      metrics.reset();
      const start = performance.now();
      const stored = await journal.putLatestDraft(incoming);
      const elapsedMs = performance.now() - start;
      if (!stored) throw new Error(`putLatestDraft rejected a newer owner draft at occupancy ${count}.`);
      const request = lastGetAll(metrics, start, "operations");
      const transaction = lastTransaction(metrics, start);
      const measuredRequests = metrics.reads.filter((item) => item.start >= start && item.store === "operations" && item.method === "getAll");
      const measuredTransactions = metrics.transactions.filter((item) => item.start >= start && item.stores.includes("operations"));
      if (measuredRequests.length !== 1 || measuredTransactions.length !== 1) throw new Error(`putLatestDraft issued an unexpected number of reads or transactions at occupancy ${count}.`);
      if (transaction.mode !== "readwrite" || transaction.durability !== "strict" || request.index !== "documentKey" || request.records !== count) {
        throw new Error(`putLatestDraft did not perform the expected strict indexed read at occupancy ${count}.`);
      }
      return { elapsedMs, strictTransactionMs: transaction.ms, transactionDurability: transaction.durability,
        indexedRead: { source: request.source, method: request.method, store: request.store,
          index: request.index, requestCount: measuredRequests.length, returnedRecords: request.records },
        transactionCount: measuredTransactions.length, stored };
    } finally {
      journal.close();
    }
  }

  async function measureC15Isolation() {
    const journal = await BrowserJournal.open();
    try {
      const repository = repositoryFor(2);
      const path = "manuscript/core64-generation-isolation.md";
      const staleExisting = entryFor({ repository, authorScope: "owner", path,
        id: "c64-existing-stale-10", generation: 10, text: "Protected generation ten\n", baseText: "Remote\n", state: "checkpointed" });
      await replaceStores({ entries: [staleExisting] });
      const staleProposed = entryFor({ repository, authorScope: "owner", path,
        id: "c64-stale-proposal-9", generation: 9, text: "Older generation nine\n", baseText: "Remote\n" });
      const staleAccepted = await journal.putLatestDraft(staleProposed);
      const staleAfter = await journal.getDocument(repository, path, "owner");
      if (staleAccepted || staleAfter.length !== 1 || staleAfter[0].operation.id !== staleExisting.operation.id) {
        throw new Error("A stale same-author generation changed protected recovery data.");
      }

      const equalExisting = entryFor({ repository, authorScope: "owner", path,
        id: "c64-equal-existing", generation: 20, text: "Existing equal generation\n", baseText: "Remote\n", state: "checkpointed" });
      await replaceStores({ entries: [equalExisting] });
      const equalProposed = entryFor({ repository, authorScope: "owner", path,
        id: "c64-equal-proposed", generation: 20, text: "Different equal generation\n", baseText: "Remote\n" });
      const equalAccepted = await journal.putLatestDraft(equalProposed);
      const equalAfter = await journal.getDocument(repository, path, "owner");
      if (equalAccepted || equalAfter.length !== 1 || equalAfter[0].operation.id !== equalExisting.operation.id) {
        throw new Error("An equal-generation different-operation proposal changed recovery data.");
      }

      const foreign = entryFor({ repository, authorScope: "other-author", path,
        id: "c64-foreign-high-generation", generation: 9999, text: "Other author's protected text\n", baseText: "Remote\n", state: "checkpointed" });
      await replaceStores({ entries: [foreign] });
      const ownerProposal = entryFor({ repository, authorScope: "owner", path,
        id: "c64-owner-first-generation", generation: 1, text: "Owner's first generation\n", baseText: "Remote\n" });
      const ownerAccepted = await journal.putLatestDraft(ownerProposal);
      const ownerAfter = await journal.getDocument(repository, path, "owner");
      const foreignAfter = await journal.getDocument(repository, path, "other-author");
      if (!ownerAccepted || ownerAfter.length !== 1 || ownerAfter[0].operation.id !== ownerProposal.operation.id ||
          foreignAfter.length !== 1 || foreignAfter[0].operation.id !== foreign.operation.id) {
        throw new Error("A foreign author's high generation blocked or replaced the owner's draft.");
      }
      return {
        staleGenerationDenied: true,
        equalGenerationDifferentOperationDenied: true,
        foreignAuthorHighGenerationDidNotBlockOwner: true,
        foreignAuthorRecordPreserved: true,
      };
    } finally {
      journal.close();
    }
  }

  async function seedInventory({ count }) {
    const entries = [];
    const proposals = [];
    for (let index = 0; index < count; index++) {
      const repositoryIndex = index % 10;
      const repository = repositoryFor(repositoryIndex);
      const authorScope = index % 20 === 19 ? "guest" : "owner";
      const path = `manuscript/core64-inventory-${index}.md`;
      const id = `c64-inventory-operation-${index}`;
      const text = `Cross-repository inventory record ${index}.\n`;
      const state = "checkpointed";
      const entry = entryFor({ repository, authorScope, path, id, generation: index + 1, text,
        baseText: "Remote inventory text\n", state });
      entries.push(entry);
      proposals.push(proposalFor(entry, `c64-proposal-${index}`));
    }
    await replaceStores({ entries, proposals, includeProposals: true });
  }

  async function measureInventory({ count, repeats }) {
    const journal = await BrowserJournal.open();
    try {
      await seedInventory({ count });
      const metrics = requireMetrics();
      const entrySamples = [];
      const proposalSamples = [];
      let entries = [];
      let proposals = [];
      for (let sample = 0; sample < repeats; sample++) {
        metrics.reset();
        let start = performance.now();
        entries = await journal.getAllEntries();
        const entryElapsedMs = performance.now() - start;
        const entryRequest = lastGetAll(metrics, start, "operations");
        const entryTransaction = firstTransaction(metrics, start, "operations");
        const entryRequestCount = metrics.reads.filter((item) => item.start >= start && item.store === "operations" && item.method === "getAll").length;
        const entryTransactionCount = metrics.transactions.filter((item) => item.start >= start && item.stores.includes("operations")).length;
        if (entries.length !== count || entryRequest.records !== count || entryRequestCount !== 1 || entryTransactionCount !== 1) {
          throw new Error("The full entry inventory was incomplete or used an unexpected number of reads/transactions.");
        }
        entrySamples.push({ elapsedMs: entryElapsedMs, requestMs: entryRequest.ms, returnedRecords: entryRequest.records,
          readSource: entryRequest.source, readMethod: entryRequest.method, readStore: entryRequest.store,
          requestCount: entryRequestCount, transactionCount: entryTransactionCount,
          transactionMode: entryTransaction.mode, transactionMs: entryTransaction.ms });

        metrics.reset();
        start = performance.now();
        proposals = await journal.getAllProposals();
        const proposalElapsedMs = performance.now() - start;
        const proposalRequest = lastGetAll(metrics, start, "proposals");
        const proposalTransaction = firstTransaction(metrics, start, "proposals");
        const proposalRequestCount = metrics.reads.filter((item) => item.start >= start && item.store === "proposals" && item.method === "getAll").length;
        const proposalTransactionCount = metrics.transactions.filter((item) => item.start >= start && item.stores.includes("proposals")).length;
        if (proposals.length !== count || proposalRequest.records !== count || proposalRequestCount !== 1 || proposalTransactionCount !== 1) {
          throw new Error("The full proposal inventory was incomplete or used an unexpected number of reads/transactions.");
        }
        proposalSamples.push({ elapsedMs: proposalElapsedMs, requestMs: proposalRequest.ms, returnedRecords: proposalRequest.records,
          readSource: proposalRequest.source, readMethod: proposalRequest.method, readStore: proposalRequest.store,
          requestCount: proposalRequestCount, transactionCount: proposalTransactionCount,
          transactionMode: proposalTransaction.mode, transactionMs: proposalTransaction.ms });
      }
      const repository = repositoryFor(0);
      metrics.reset();
      let scopedStart = performance.now();
      const scopedEntries = await journal.getRepository(repository, "owner");
      const scopedEntryRequest = lastGetAll(metrics, scopedStart, "operations");
      metrics.reset();
      scopedStart = performance.now();
      const scopedProposals = await journal.getProposals(repository, "owner");
      const scopedProposalRequest = lastGetAll(metrics, scopedStart, "proposals");
      const expectedScoped = Array.from({ length: count }, (_, index) => index)
        .filter((index) => index % 10 === 0 && index % 20 !== 19).length;
      const scopedEntryLeak = scopedEntries.some((entry) => entry.repositoryKey !== repositoryKey(repository) || entry.authorScope !== "owner");
      const scopedProposalLeak = scopedProposals.some((record) => record.repositoryKey !== repositoryKey(repository) || record.authorScope !== "owner");
      if (scopedEntries.length !== expectedScoped || scopedProposals.length !== expectedScoped || scopedEntryLeak || scopedProposalLeak) {
        throw new Error("Repository/author scoped reads returned records outside their identity scope.");
      }
      return {
        rowsPerStore: count,
        repositoryCount: 10,
        authorScopes: { owner: entries.filter((entry) => entry.authorScope === "owner").length,
          guest: entries.filter((entry) => entry.authorScope === "guest").length },
        entryInventoryJsonUtf8Bytes: utf8Bytes(JSON.stringify(entries)),
        proposalInventoryJsonUtf8Bytes: utf8Bytes(JSON.stringify(proposals)),
        getAllEntriesSamples: entrySamples,
        getAllProposalsSamples: proposalSamples,
        scopedRepositoryAuthorReads: {
          returnedEntries: scopedEntries.length,
          returnedProposals: scopedProposals.length,
          expected: expectedScoped,
          entryIndex: scopedEntryRequest.index,
          entryIndexRows: scopedEntryRequest.records,
          entryIndexRequestCount: 1,
          proposalIndex: scopedProposalRequest.index,
          proposalIndexRows: scopedProposalRequest.records,
          proposalIndexRequestCount: 1,
          noCrossRepositoryOrAuthorLeak: true,
        },
      };
    } finally {
      journal.close();
    }
  }

  window.__core64JournalProbe = {
    async measurePayload(input) { return measurePayload(input); },
    async measureC15(count, repeats) {
      const samples = [];
      for (let sample = 0; sample < repeats; sample++) samples.push(await seedAndMeasurePutLatestDraft({ count, sample }));
      return samples;
    },
    async measureC15Isolation() { return measureC15Isolation(); },
    async measureInventory(input) { return measureInventory(input); },
    ready: true,
  };
</script>
